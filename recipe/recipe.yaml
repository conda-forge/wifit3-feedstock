context:
  version: "0.7.1"

package:
  name: wifit3
  version: ${{ version }}

source:
  url: https://github.com/derv82/wifit3/archive/v${{ version }}.tar.gz
  sha256: b62ebde767d9047bd5f1490f7efe59645f02a3ac186059fa427c213c4f1203fb
  patches:
    # build for the native arch only; conda's python and libusb_package are thin.
    - 0001-native-target-arch.patch

build:
  number: 0
  script:
    content:
      - uv run --python 3.12 pyinstaller wifit3.spec --noconfirm --clean
      - if: unix
        then:
          - mkdir -p "$PREFIX/bin"
          - install -m0755 dist/wifit3 "$PREFIX/bin/"
        else:
          - mkdir -p "%LIBRARY_BIN%"
          - install -m0755 dist/wifit3 "%LIBRARY_BIN%"

requirements:
  build:
    - uv

tests:
  - script:
      - wifit3 --version
      - wifit3 --help
  - package_contents:
      strict: true
      bin:
        - wifit3

about:
  homepage: https://github.com/derv82/wifit3
  summary: "Wifite but USB-only & cross-platform."
  description: |
    A standalone USB Wi-Fi auditor for Linux, Windows, and macOS.
  license: GPL-2.0-or-later
  license_file:
    - LICENSE
  repository: https://github.com/derv82/wifit3

extra:
  recipe-maintainers:
    - XhstormR
